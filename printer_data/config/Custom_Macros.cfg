#####################################################################
#   A better print_start macro for v2/trident
#####################################################################

## *** THINGS TO UNCOMMENT: ***
## Bed mesh (2 lines at 2 locations)
## Nevermore (if you have one)
## Z_TILT_ADJUST (For Trident only)
## QUAD_GANTRY_LEVEL (For V2.4 only)

[gcode_macro PRINT_START]
gcode:
  CLEAR_PAUSE
  # This part fetches data from your slicer. Such as bed, extruder, and chamber temps and size of your printer.
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set target_chamber = params.CHAMBER|default("45")|int %}
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}
  {% set initial_tool = params.TOOL|default("0")|int %}

  SET_GCODE_OFFSET Z=0                                 # Set offset to 0

  # Home the printer, set absolute positioning and update the Stealthburner LEDs.
  STATUS_HOMING                                         # Set LEDs to homing-mode
  
  G28                                                   # Full home (XYZ)
  G90                                                   # Absolute position

  ##  Uncomment for bed mesh (1 of 2 for bed mesh)
  # AFC_PARK
  BED_MESH_CLEAR                                       # Clear old saved bed mesh (if any)
  STATUS_PART_READY
  

  # SET_FAN_SPEED FAN=Bed_Fan SPEED=0.5  # <-- include this in filament G-Code
  # Check if the bed temp is higher than 90c - if so then trigger a heatsoak.
  {% if params.BED|int > 90 %}
    SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"           # Display info on display
    STATUS_HEATING                                      # Set LEDs to heating-mode
    
    # M106 S255                                           # Turn on the PT-fan

    ##  Uncomment if you have a Nevermore.
    #SET_PIN PIN=nevermore VALUE=1                      # Turn on the nevermore

    # G1 X{x_wait} Y{y_wait} Z15 F9000                    # Go to center of the bed
    
    M190 S{target_bed}                                  # Set the target temp for the bed
    SET_DISPLAY_TEXT MSG="Heatsoak: {target_chamber}c"  # Display info on display
    # TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={target_chamber}   # Waits for chamber temp

  # If the bed temp is not over 90c, then skip the heatsoak and just heat up to set temp with a 5 min soak
  {% else %}
    SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"           # Display info on display
    STATUS_HEATING                                      # Set LEDs to heating-mode
    
    # G1 X{x_wait} Y{y_wait} Z15 F9000                    # Go to center of the bed
    M190 S{target_bed}                                  # Set the target temp for the bed
    # SET_DISPLAY_TEXT MSG="Soak for 3 min"               # Display info on display
    # G4 P180000                                          # Wait 5 min for the bedtemp to stabilize
  {% endif %}

  # Heat hotend to 150c. This helps with getting a correct Z-home.
  SET_DISPLAY_TEXT MSG="Hotend: 150c"                   # Display info on display
  M109 S150                                             # Heat hotend to 150c

  ##  Uncomment for Trident (Z_TILT_ADJUST)
  SET_DISPLAY_TEXT MSG="Leveling"                      # Display info on display
  STATUS_LEVELING                                      # Set LEDs to leveling-mode
  Z_TILT_ADJUST                                        # Level the printer via Z_TILT_ADJUST
  G28 Z                                                # Home Z again after Z_TILT_ADJUST

  ##  Uncomment for V2.4 (Quad gantry level AKA QGL)
  # SET_DISPLAY_TEXT MSG="Leveling"                      # Display info on display
  # STATUS_LEVELING                                      # Set LEDs to leveling-mode
  
  # QUAD_GANTRY_LEVEL                                    # Level the printer via QGL
  # G28 Z   
  # Home Z again after QGL

  # AFC_BRUSH
  BRUSH
  # AFC_PARK

  # BRUSH
  # _CLIENT_LINEAR_MOVE Z=10 F=6000

  # G1 X40 Y200 F6000

  CARTOGRAPHER_TOUCH_HOME
  
  ##  Uncomment for bed mesh (2 of 2 for bed mesh)
  SET_DISPLAY_TEXT MSG="Bed mesh"                      # Display info on display
  STATUS_MESHING                                       # Set LEDs to bed mesh-mode
  
  BED_MESH_CALIBRATE ADAPTIVE=1      # Start the bed mesh (add ADAPTIVE=1) for adaptive bed mesh

  # CARTOGRAPHER_TOUCH

  # Heat up the hotend up to target via data from slicer

  # AFC_PARK
  
  SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}c"     # Display info on display
  STATUS_HEATING                                        # Set LEDs to heating-mode
  
  
  # G1 X{x_wait} Y{y_wait} Z15 F9000                      # Go to center of the bed
  M107                                                  # Turn off partcooling fan
  M109 S{target_extruder}                               # Heat the hotend to set temp

  # T{initial_tool}

  # AFC_PARK
  
  # Get ready to print by doing a primeline and updating the LEDs
  SET_DISPLAY_TEXT MSG="Printer goes brr"               # Display info on display
  STATUS_PRINTING                                       # Set LEDs to printing-mode

  # LIGHTS_PRINTING
  # LIGHTS_PRINT_PROGRESS PROGRESS=0
  
  # G0 X{x_wait - 50} Y4 F15000                           # Go to starting point
  # G0 Z0.4                                               # Raise Z to 0.4
  # G91                                                   # Incremental positioning 
  # G1 X100 E20 F1000                                     # Primeline
  # G90                                                   # Absolute position

  # AFC_BRUSH
  # ADAPTIVE_PURGE




#####################################################################
#   Print_End
#####################################################################

[gcode_macro PRINT_END]
gcode = 

    
    SET_DISPLAY_TEXT MSG="Printing Complete..... Just doing some post print protocols :)"
	M400                 ; wait for buffer to clear
	G91                  ; Relative positioning
	G1 E-20 F3000        ; Retract a bit
	G1 E-2 Z0.2 F2400    ; Retract and raise Z
	G1 X5 Y5 F3000       ; Wipe out
	G1 Z10               ; Raise Z more
	# BRUSH
    
    
    # G28 X0 Y0
    # _CLIENT_LINEAR_MOVE Z=10 F=1500 ABSOLUTE=1
    
    # BT_TOOL_UNLOAD
    # AFC_PARK
    
    M106 S255
    M104 S170
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM=165 MAXIMUM=170

    # LIGHTS_PRINT_COMPLETE      # 20-second celebration strobing

    # After celebration, return to idle
    # STOP_LIGHT_EFFECTS         # Stop all effects
    # LIGHTS_IDLE               # Return to idle lighting
    
    BRUSH   ## <===  undo this again
    _CLIENT_LINEAR_MOVE Y=-50 F=6000
    

    # AFC_PARK       ## <===  undo this again
    # G28 X0 Y0            ; Present print
    
    # G28 X0 Y0
	G90                  ; Absolute positioning
    # STATUS_COOLING
	# M106 S0              ; Turn-off fan
	M104 S0              ; Turn-off hotend
	M140 S0              ; Turn-off bed                        ; turn off fan
	G90                            ; absolute positioning
	# G0 X60 Y{max_y} F3500          ; park nozzle at rear
    M84
    # M106 S255
    # G4 P300000
    # M107                           ; turn off fan
    BED_MESH_CLEAR
    G4 P60000
    STATUS_READY
    # CHAMBER_LIGHTS__OFF

    # VENTS_OFF
    M106 S0              ; Turn-off fan


#####################################################################
#   Z offset calibrate
#####################################################################
[gcode_macro CALIBRATE_Z_OFFSET]
gcode:
    # Heat up the bed and nozzle (optional, but recommended for accuracy)
    M109 S150 ; Set nozzle temperature to 200C and wait
    M190 S60  ; Set bed temperature to 60C and wait
    # Home all axes
    {% if "xyz" not in printer.toolhead.homed_axes %}
      G28
    {% endif %}
    
    # Run the Klipper PROBE_CALIBRATE tool
    PROBE_CALIBRATE


#####################################################################
#   Filament Unload
#####################################################################

[gcode_macro Filament_Unload]
gcode:
    {% if (printer.extruder.can_extrude|lower != 'true')%} # checing for minimum extrusion temperature
      M118 Hotend heating!          
      SET_HEATER_TEMPERATURE HEATER=extruder TARGET=200 # restore user temp if it was set before loading
      TEMPERATURE_WAIT SENSOR=extruder MINIMUM=200 # wait for reaching configured unload temperature
    {% endif %}
    {% if(printer.extruder.target == 0) %} # checing for set temperature if is zero than set to 185 / hotend hot but cooling due to set target temp 0
      TEMPERATURE_WAIT SENSOR=extruder MINIMUM=200 # wait for reaching configured unload temperature
    {% endif %}
    G0 E10 F500 # extruder 20mm of filament before extracting 
    G0 E-5 F3600 	#extract filament to cold end
    G4 P2000 # wait for two seconds
    G0 E6 F3600 # push the filament back 
    G0 E-10 F3600 	#extract filament to cold end
    G0 E-{sensor.unload_distance} F300	# continue extraction slow allow filament to be cooled enough before reaches the gears  
    M104 S0 T0 
    M400 # wait to complete unload
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM=165 MAXIMUM=170
    BRUSH
    M118 Filament unload complete! 